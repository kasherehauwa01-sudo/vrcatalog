server {
    listen 8080;
    server_name _;

    client_max_body_size 200m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Формирование Excel (особенно с фотографиями) может занимать дольше
    # стандартных 60 секунд nginx, поэтому для экспорта задаём отдельный тайм-аут.
    location = /vr/catalog/api/export.xlsx {
        proxy_pass http://backend:8000/api/export.xlsx;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /vr/catalog;
    }

    location /vr/catalog/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /vr/catalog;
    }

    root /usr/share/nginx/html;

    location ~ (^|/)\.(?!well-known(?:/|$)) { return 404; }
    location ~* ^/vr/catalog/(?:docker-compose\.yml|backend/|frontend/|.*\.(?:bak|old|env)) { return 404; }

    location = /vr/catalog/manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /vr/catalog/ {
        try_files $uri $uri/ /vr/catalog/index.html;
    }

    location = /vr/catalog {
        return 301 /vr/catalog/;
    }
}
