# Include in the HTTPS server after configuring ssl_client_certificate and
# ssl_verify_client. Replace the existing VR Catalog locations in that server.

location = /vr/catalog {
    return 308 /vr/catalog/;
}

location = /__vrcatalog_device_authorization {
    internal;
    proxy_pass http://127.0.0.1:8080/vr/catalog/api/access/verify;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Content-Length "";
    proxy_set_header X-VR-Device-Verify $ssl_client_verify;
    proxy_set_header X-VR-Device-Certificate $ssl_client_escaped_cert;
    include /etc/nginx/vrcatalog-device/proxy-secret.conf;
}

# These namespaces already authenticate service requests with the existing
# integration token. Browser and administrator routes stay in the main location.
location ^~ /vr/catalog/api/integration/ {
    proxy_pass http://127.0.0.1:8080/vr/catalog/api/integration/;
    include /etc/nginx/vrcatalog-device/upstream.conf;
}

location ^~ /vr/catalog/api/internal/ {
    proxy_pass http://127.0.0.1:8080/vr/catalog/api/internal/;
    include /etc/nginx/vrcatalog-device/upstream.conf;
}

location = /vr/catalog/api/export.xlsx {
    auth_request /__vrcatalog_device_authorization;
    proxy_pass http://127.0.0.1:8080;
    include /etc/nginx/vrcatalog-device/upstream.conf;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
}

location ^~ /vr/catalog/ {
    auth_request /__vrcatalog_device_authorization;
    proxy_pass http://127.0.0.1:8080;
    include /etc/nginx/vrcatalog-device/upstream.conf;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
}
