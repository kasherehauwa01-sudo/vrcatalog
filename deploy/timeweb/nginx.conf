server {
    listen 80;
    server_name kvasmix.ru www.kvasmix.ru;

    client_max_body_size 200m;

    # Старые версии интерфейса скачивают Excel одним длительным запросом.
    # Тайм-аут задаётся именно во внешнем nginx на VPS (Ubuntu), который
    # принимает запрос пользователя до nginx внутри Docker-контейнера.
    location = /vr/catalog/api/export.xlsx {
        proxy_pass http://127.0.0.1:8080/vr/catalog/api/export.xlsx;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /vr/catalog;
    }

    location /vr/catalog/ {
        proxy_pass http://127.0.0.1:8080/vr/catalog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /vr/catalog;
    }
}
